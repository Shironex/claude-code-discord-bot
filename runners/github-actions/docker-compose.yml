# Docker Compose for GitHub Actions Self-Hosted Runner
# Supports Claude Code workflows from templates

version: '3.8'

services:
  github-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-github-runner
    restart: unless-stopped
    
    # Environment variables (set these in your .env file or environment)
    environment:
      # Required: GitHub Personal Access Token with repo and admin:repo_hook permissions
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      
      # Required: GitHub repository in format owner/repo
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
      
      # Optional: Custom runner name (defaults to claude-runner-<hostname>)
      - RUNNER_NAME=${RUNNER_NAME:-}
      
      # Optional: Runner labels (comma-separated)
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,claude-workflows,docker}
      
      # Optional: Runner group
      - RUNNER_GROUP=${RUNNER_GROUP:-default}
      
      # Optional: Working directory for runner
      - RUNNER_WORK_DIR=${RUNNER_WORK_DIR:-/home/runner/_work}
    
    # Volume mounts
    volumes:
      # Mount Docker socket if you need Docker-in-Docker support
      # WARNING: This gives the container access to the Docker daemon
      # Only uncomment if you trust the workflows being executed
      # - /var/run/docker.sock:/var/run/docker.sock
      
      # Persistent work directory (optional)
      - runner_work:/home/runner/_work
      
      # Persistent runner configuration (optional)
      - runner_config:/home/runner/.runner
    
    # Resource limits (adjust based on your requirements)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "Runner.Listener"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Network configuration
    networks:
      - runner_network

# Volumes for persistent data
volumes:
  runner_work:
    driver: local
  runner_config:
    driver: local

# Networks
networks:
  runner_network:
    driver: bridge