name: PR Checks

on:
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  HUSKY: 0

jobs:
  changeset-validation:
    name: Changeset Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check for changesets
        id: changeset-check
        run: |
          # Add robust error handling for git operations
          if git fetch origin ${{ github.event.pull_request.base.ref }} 2>/dev/null; then
            echo "✅ Successfully fetched base branch"
            
            # Check if this PR has any changesets
            if pnpm changeset status --since=origin/${{ github.event.pull_request.base.ref }} --output=changeset-status.json 2>/dev/null; then
              if [ -s changeset-status.json ] && [ "$(cat changeset-status.json | jq '.releases | length')" -gt 0 ]; then
                echo "has_changesets=true" >> $GITHUB_OUTPUT
                echo "✅ Changesets detected for this PR"
                echo "changeset_summary<<EOF" >> $GITHUB_OUTPUT
                echo "$(pnpm changeset status --since=origin/${{ github.event.pull_request.base.ref }} --verbose)" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
              else
                echo "has_changesets=false" >> $GITHUB_OUTPUT
                echo "⚠️ No changesets detected for this PR"
              fi
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
              echo "⚠️ No changesets detected for this PR (changeset status failed)"
            fi
          else
            echo "⚠️ Unable to fetch base branch for changeset comparison"
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "changeset_summary=Unable to determine changeset status due to git fetch failure" >> $GITHUB_OUTPUT
          fi

      - name: Changeset Preview
        if: steps.changeset-check.outputs.has_changesets == 'true'
        run: |
          echo "## 📦 Changeset Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changeset-check.outputs.changeset_summary }}" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (changesets found)
        if: steps.changeset-check.outputs.has_changesets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 📦 Changeset Preview
            
            ✅ This PR includes changesets that will trigger a release.
            
            <details>
            <summary>Changeset Details</summary>
            
            \`\`\`
            ${{ steps.changeset-check.outputs.changeset_summary }}
            \`\`\`
            </details>
            
            The packages will be versioned and published when this PR is merged to master.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Comment on PR (no changesets)
        if: steps.changeset-check.outputs.has_changesets == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 📦 Changeset Status
            
            ⚠️ No changesets were detected for this PR.
            
            If this PR introduces changes that should trigger a release, please add a changeset:
            \`\`\`bash
            pnpm changeset
            \`\`\`
            
            If this is intentional (e.g., docs, tests, or internal changes), you can ignore this message.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Version preview
        if: steps.changeset-check.outputs.has_changesets == 'true'
        run: |
          echo "## Version Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running \`pnpm changeset version --snapshot preview\` to show potential version changes:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pnpm changeset version --snapshot preview --dry-run || echo "Preview not available"

      - name: Clean up
        if: always()
        run: |
          rm -f changeset-status.json