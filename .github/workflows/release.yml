name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  HUSKY: 0

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check for changesets
        id: changesets
        run: |
          if pnpm changeset status --output=changeset-status.json 2>/dev/null; then
            if [ -s changeset-status.json ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
              echo "📦 Changesets detected - proceeding with release"
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
              echo "🚫 No changesets detected - skipping release"
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "🚫 No changesets detected - skipping release"
          fi

      - name: Version packages and create changelog
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          # Version packages based on changesets
          pnpm changeset version
          
          # Get the new version
          NEW_VERSION=$(node -p "require('./apps/discord-bot/package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          # Commit the version changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): version packages to $NEW_VERSION"
          
          # Create git tag
          git tag "@claude-code/discord-bot@$NEW_VERSION" -m "Release @claude-code/discord-bot@$NEW_VERSION"
          
          # Push changes and tags
          git push origin master --follow-tags
        
      - name: Create GitHub Release
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "@claude-code/discord-bot@${{ env.NEW_VERSION }}"
          name: "Discord Bot v${{ env.NEW_VERSION }}"
          body: |
            🚀 **Discord Bot Release v${{ env.NEW_VERSION }}**
            
            This release includes the latest updates to the Claude Code Discord Bot.
            
            ## What's Changed
            Check the [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/apps/discord-bot/CHANGELOG.md) for detailed changes.
            
            ## Installation
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd claude-code-discord-bot
            pnpm install
            ```
            
            🤖 Automated release generated by GitHub Actions
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        if: always()
        run: |
          rm -f changeset-status.json